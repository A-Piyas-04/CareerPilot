services:
  backend:
    build: ./backend
    container_name: careerpilot-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./supabase:/supabase:ro
    env_file:
      - ./backend/.env
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    build: ./frontend
    container_name: careerpilot-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # Keep .next inside the container so Turbopack route manifests are not corrupted by host sync
      - frontend_next_cache:/app/.next
    env_file:
      - ./.env
      - ./frontend/.env
    environment:
      - WATCHPACK_POLLING=true
      - WATCHPACK_POLLING_INTERVAL=1000
      - CHOKIDAR_USEPOLLING=true
    command:
      - sh
      - -c
      - >-
        if [ -f /app/.next/dev/types/routes.d.ts ] &&
        ! grep -q 'AppRoutes.*"/resume"' /app/.next/dev/types/routes.d.ts;
        then rm -rf /app/.next; fi;
        exec npm run dev:webpack -- --hostname 0.0.0.0 --port 3000
    depends_on:
      - backend

volumes:
  frontend_next_cache:
